# Monitoreo del turnero de Balance Center (Upptime: corre con GitHub Actions, sin servidor propio).
# Revisa /api/health cada 5 minutos: responde 200 solo si la app y la base andan.
# Si se cae, abre un issue en este repo (GitHub le avisa por mail a turnerito) y lo cierra al volver.
owner: turnerito
repo: estado-balance-center

sites:
  - name: Turnero Balance Center
    url: https://turnero-balance-center.onrender.com/api/health
    expectedStatusCodes:
      - 200
    maxResponseTime: 15000 # /api/health le da hasta 10 s a la base

assignees:
  - turnerito

status-website:
  baseUrl: /estado-balance-center
  name: Estado de Balance Center
  introTitle: "Estado del turnero de **Balance Center**"
  introMessage: Si la app no anda, acá se ve si ya lo sabemos. Se revisa cada 5 minutos.
  navbar:
    - title: Estado
      href: /

# Más opciones (Telegram, mail): https://upptime.js.org/docs/configuration
